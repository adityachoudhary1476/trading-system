[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-system"
version = "0.1.0"
description = "AI-assisted market analysis and paper-trading research system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.5",
    "numpy==2.4.6",
    "SQLAlchemy==2.0.52",
    "python-dotenv==1.2.3",
    "requests==2.31.0",
    "tabulate==0.10.0",
    "pydantic==2.13.4",
    "websocket-client==1.7.0",
    "fastapi==0.115.0",
    "cryptography==43.0.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
